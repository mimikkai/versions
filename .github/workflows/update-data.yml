name: Update download page data

on:
  push:
    branches: [master]
    paths:
      - 'stable/**/latest.json'
      - 'insider/**/latest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate data/*.json
        run: |
          node -e "(async () => {
          const fs = require('fs'), path = require('path');
          const data = { stable: [], insider: [] };
          for (const ch of ['stable', 'insider']) {
            const walk = async (dir) => {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) await walk(p);
                else if (e.name === 'latest.json') {
                  const j = JSON.parse(fs.readFileSync(p, 'utf8'));
                  const entry = { path: path.dirname(p).split(path.sep).join('/'), name: j.name, productVersion: j.productVersion, url: j.url, timestamp: j.timestamp };
                  // Derive DMG download URL for macOS entries (zip asset is the updater feed; DMG is the user-facing installer).
                  // Releases built before DMG support have no DMG asset: verify existence, otherwise omit.
                  const m = entry.url.match(/(MimikkAI\.Editor)-darwin-(arm64|x64)-([0-9.]+(?:-insider)?)\.zip$/);
                  if (m) {
                    const dmg = entry.url.replace(/MimikkAI\.Editor-darwin-(arm64|x64)-([0-9.]+(?:-insider)?)\.zip$/, m[1] + '.' + m[2] + '.' + m[3] + '.dmg');
                    try {
                      const res = await fetch(dmg, { method: 'HEAD', redirect: 'follow' });
                      if (res.ok) entry.dmg = dmg;
                      else console.error('no DMG asset for ' + entry.path + ' (' + res.status + ')');
                    } catch { console.error('DMG check failed for ' + entry.path); }
                  }
                  data[ch].push(entry);
                }
              }
            };
            await walk(ch);
          }
          for (const ch of Object.keys(data)) {
            data[ch].sort((a, b) => a.path.localeCompare(b.path));
            fs.writeFileSync('data/' + ch + '.json', JSON.stringify(data[ch], null, 2) + '\n');
          }
          console.log('stable:', data.stable.length, 'insider:', data.insider.length);
          })().catch(e => { console.error(e); process.exit(1); });"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update page data: $(date -u +%Y-%m-%d\ %H:%M:%S) UTC"
            git push
          fi